<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A four-quadrant to-do list. Your tasks never leave your browser.">
<title>The Four Corners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600;1,9..144,700&family=Inter:wght@400..700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#f0f0ee; --surface:#fafaf9; --surface2:#e7e7e4;
    --ink:#1c1c1c; --muted:#5f5f5b; --line:#d6d6d3; --line-soft:#e2e2df;
    --late:#a83d38; --late-ink:#fafaf9;
    --body-weight:400;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#242424; --surface:#2c2c2c; --surface2:#383838;
      --ink:#e2e2df; --muted:#a3a39e; --line:#474747; --line-soft:#3a3a3a;
      --late:#c4655f; --late-ink:#1e1e1e;
      --body-weight:450;
    }
  }
  :root[data-theme="dark"]{
    --bg:#242424; --surface:#2c2c2c; --surface2:#383838;
    --ink:#e2e2df; --muted:#a3a39e; --line:#474747; --line-soft:#3a3a3a;
    --late:#c4655f; --late-ink:#1e1e1e;
    --body-weight:450;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; font-size:16px;
    font-weight:var(--body-weight);
    padding:clamp(18px,4vw,44px) clamp(14px,4vw,40px) 70px;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
  .wrap{max-width:1120px;margin:0 auto}

  /* ---------- masthead ---------- */
  .masthead{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;
    border-bottom:2.5px solid var(--ink);padding-bottom:14px;margin-bottom:8px;position:relative}
  .masthead::after{content:"";position:absolute;left:0;right:0;bottom:-6px;
    border-bottom:1px solid var(--ink)}   /* newspaper double rule */
  .masthead h1{font-family:'Fraunces',serif;font-style:italic;font-weight:700;
    font-size:clamp(1.7rem,3.5vw,2.4rem);letter-spacing:-0.01em;text-wrap:balance}
  .dateline{font-family:'Space Grotesk',sans-serif;font-size:.74rem;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
  .seg button{font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:600;
    letter-spacing:.09em;text-transform:uppercase;padding:7px 15px;color:var(--muted)}
  .seg button.on{background:var(--ink);color:var(--bg)}
  .btn{font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;border:1.5px solid var(--ink);border-radius:999px;padding:7px 16px}
  .btn:hover{background:var(--ink);color:var(--bg)}
  #saveState{font-family:'Space Grotesk',sans-serif;font-size:.68rem;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:64px;text-align:right}
  .ro-note{font-family:'Fraunces',serif;font-style:italic;color:var(--muted);margin:10px 0 0;display:none}
  body.ro .ro-note{display:block}

  .sort-hint{font-family:'Fraunces',serif;font-style:italic;font-size:.92rem;color:var(--muted);margin:12px 2px 20px}

  /* ---------- grid + quadrants ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .q{background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:18px 18px 14px;display:flex;flex-direction:column;min-height:230px}
  .q-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:6px}
  .q-name{font-family:'Fraunces',serif;font-style:italic;font-weight:700;font-size:1.22rem;
    color:var(--ink);border-radius:3px;padding:0 2px;margin-left:-2px}
  .q-name[contenteditable]:hover{text-decoration:underline dotted var(--muted);text-underline-offset:5px}
  .q-name:focus{outline:1px dotted var(--muted);outline-offset:3px;text-decoration:none}
  .q-count{font-family:'Space Grotesk',sans-serif;font-size:.66rem;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* ---------- tasks ---------- */
  .tasks{list-style:none;flex:1;overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .tasks::-webkit-scrollbar{width:8px}
  .tasks::-webkit-scrollbar-track{background:transparent}
  .tasks::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  .tasks::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  .tasks.capped{padding-right:8px;
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);
    mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent)}
  .tasks.capped.at-end{-webkit-mask-image:none;mask-image:none}
  .task{border-bottom:1px dotted var(--line);padding:8px 0 7px}
  .task.dragging{opacity:.35}
  .task.drop-above{box-shadow:0 -2px 0 var(--ink)}
  .task.drop-below{box-shadow:0 2px 0 var(--ink)}
  .task-row{display:flex;align-items:center;gap:9px}
  .handle{display:none;color:var(--muted);cursor:grab;font-size:.85rem;line-height:1;
    padding:2px 1px;user-select:none;touch-action:none}
  body.manual .handle{display:inline-block}
  .chk{width:16px;height:16px;border-radius:50%;border:1.7px solid var(--muted);
    flex:none;position:relative;transition:background .12s ease,border-color .12s ease}
  .chk:hover{border-color:var(--ink)}
  .chk.on{background:var(--ink);border-color:var(--ink)}
  .chk.sm{width:12px;height:12px;border-width:1.4px}
  .t-title{flex:1;min-width:0;line-height:1.4;overflow-wrap:anywhere;border-radius:3px;padding:1px 3px}
  .t-title:focus{outline:1px dotted var(--muted);outline-offset:2px}
  .task.done-item .t-title,.sub.done-item .s-title{text-decoration:line-through;color:var(--muted)}
  .chip{font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.07em;
    text-transform:uppercase;border:1px solid var(--muted);color:var(--ink);
    border-radius:999px;padding:3px 10px;flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
  .chip.late{background:var(--late);border-color:var(--late);color:var(--late-ink)}
  .chip.none{border-style:dashed;color:var(--muted);border-color:var(--muted)}
  .icon-btn{color:var(--muted);font-size:.95rem;line-height:1;padding:2px 4px;border-radius:4px;
    opacity:0;transition:opacity .12s ease;flex:none}
  .task-row:hover .icon-btn,.task-row:focus-within .icon-btn,
  .sub:hover .icon-btn,.sub:focus-within .icon-btn{opacity:1}
  @media (hover:none){.icon-btn{opacity:.55}}
  .icon-btn:hover{color:var(--ink);background:var(--surface2)}
  /* ---------- calendar popover (own widget: never clipped, flips up near bottom) ---------- */
  .cal{position:fixed;z-index:80;width:264px;display:none;padding:12px 12px 9px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 18px 44px -12px rgba(0,0,0,.42),0 2px 8px rgba(0,0,0,.14)}
  .cal.open{display:block}
  .cal-head{display:flex;align-items:center;gap:2px;margin-bottom:6px}
  .cal-title{flex:1;text-align:center;font-family:'Fraunces',serif;font-style:italic;
    font-weight:700;font-size:1.02rem}
  .cal-nav{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;
    color:var(--muted);font-size:.9rem;line-height:1}
  .cal-nav:hover{background:var(--surface2);color:var(--ink)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-dow{font-family:'Space Grotesk',sans-serif;font-size:.6rem;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;padding:3px 0 1px}
  .cal-day{height:30px;border-radius:6px;font-size:.85rem;display:grid;place-items:center;
    font-variant-numeric:tabular-nums;color:var(--ink)}
  .cal-day:hover{background:var(--surface2)}
  .cal-day.other{color:var(--muted);opacity:.5}
  .cal-day.today{box-shadow:inset 0 0 0 1px var(--muted);font-weight:600}
  .cal-day.past{color:var(--muted);opacity:.72}   /* past days dimmed, not alarming */
  .cal-day.sel{background:var(--ink);color:var(--bg);font-weight:600;box-shadow:none}
  .cal-foot{display:flex;justify-content:space-between;align-items:center;
    margin-top:7px;padding-top:7px;border-top:1px solid var(--line-soft)}
  .cal-foot button{font-family:'Space Grotesk',sans-serif;font-size:.66rem;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:3px 6px;border-radius:5px}
  .cal-foot button:hover{color:var(--ink);background:var(--surface2)}

  /* ---------- sub-bullets ---------- */
  .subs{list-style:none;margin:4px 0 1px 25px}
  body.manual .subs{margin-left:41px}
  .sub{display:flex;align-items:center;gap:8px;padding:3.5px 0;font-size:.92rem;color:var(--ink)}
  .s-title{flex:1;min-width:0;line-height:1.35;overflow-wrap:anywhere;border-radius:3px;padding:1px 3px}
  .s-title:focus{outline:1px dotted var(--muted);outline-offset:2px}

  /* ---------- add row ---------- */
  .add-row{display:flex;gap:8px;align-items:center;margin-top:10px;padding-top:10px;
    border-top:1px solid var(--line-soft)}
  .add-title{flex:1;min-width:0;background:transparent;border:none;border-bottom:1px solid var(--line);
    padding:5px 2px;font-size:.9rem}
  .add-title::placeholder{font-family:'Fraunces',serif;font-style:italic;color:var(--muted)}
  .add-title:focus{outline:none;border-bottom-color:var(--ink)}
  .add-date{background:transparent;border:1px solid var(--line);border-radius:999px;
    font-family:'Space Grotesk',sans-serif;font-size:.7rem;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;padding:4px 11px;color:var(--muted);flex:none;white-space:nowrap}
  .add-date:hover{border-color:var(--ink);color:var(--ink)}
  .add-date.set{color:var(--ink);border-color:var(--muted)}
  .add-date.need{border-color:var(--late);color:var(--late)}
  .add-btn{width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;flex:none;
    font-size:1rem;line-height:1;display:grid;place-items:center}
  .add-btn:hover{background:var(--ink);color:var(--bg)}
  body.ro .add-row{display:none}

  /* ---------- archive ---------- */
  .arch{display:none;margin-top:22px;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;padding:18px 20px 16px}
  body.arch-open .arch{display:block}
  .arch-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:4px}
  .arch-head h2{font-family:'Fraunces',serif;font-style:italic;font-weight:700;font-size:1.22rem}
  .arch-note{font-family:'Fraunces',serif;font-style:italic;color:var(--muted);
    font-size:.92rem;margin:10px 2px 2px}
  .arch-list{list-style:none;max-height:340px;overflow-y:auto;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent}
  .arch-list::-webkit-scrollbar{width:8px}
  .arch-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  .arch-item{display:flex;align-items:center;gap:10px;padding:9px 2px;
    border-bottom:1px dotted var(--line);flex-wrap:wrap}
  .arch-corner{font-family:'Space Grotesk',sans-serif;font-size:.6rem;font-weight:600;
    letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:2px 8px;flex:none}
  .arch-title{flex:1;min-width:140px;line-height:1.35;overflow-wrap:anywhere}
  .arch-when{font-family:'Space Grotesk',sans-serif;font-size:.64rem;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none;
    font-variant-numeric:tabular-nums}
  .arch-subs{font-family:'Fraunces',serif;font-style:italic;font-size:.84rem;
    color:var(--muted);flex-basis:100%;margin-left:2px}
  .arch-act{font-family:'Space Grotesk',sans-serif;font-size:.64rem;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:3px 10px;flex:none}
  .arch-act:hover{border-color:var(--ink);color:var(--ink)}
  .arch-act.danger:hover,.arch-act.confirming{border-color:var(--late);color:var(--late)}
  .arch-foot{display:flex;justify-content:flex-end;margin-top:10px;padding-top:9px;
    border-top:1px solid var(--line-soft)}
  #archBtn .n{font-variant-numeric:tabular-nums}
  .empty-hint{font-family:'Fraunces',serif;font-style:italic;color:var(--muted);
    padding:16px 2px;font-size:.95rem}

  /* ---------- done ---------- */
  .arch-filter{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .arch-filter button{font-family:'Space Grotesk',sans-serif;font-size:.62rem;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:5px 12px}
  .arch-filter button:hover{color:var(--ink)}
  .arch-filter button.on{background:var(--ink);color:var(--bg)}
  .arch-mark{font-size:.85rem;line-height:1;color:var(--muted);flex:none;width:12px;text-align:center}
  .arch-item.was-done .arch-mark{color:var(--ink)}
  details.done{margin-top:8px;border-top:1px solid var(--line-soft);padding-top:6px}
  details.done summary{font-family:'Space Grotesk',sans-serif;font-size:.68rem;font-weight:600;
    letter-spacing:.13em;text-transform:uppercase;color:var(--muted);cursor:pointer;
    list-style:none;display:flex;align-items:center;gap:8px;padding:3px 0}
  details.done summary::-webkit-details-marker{display:none}
  details.done summary::before{content:"›";font-size:.9rem;transition:transform .15s ease;display:inline-block}
  details.done[open] summary::before{transform:rotate(90deg)}
  .clear-done{margin-left:auto;font-family:'Space Grotesk',sans-serif;font-size:.64rem;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:underline dotted}
  .clear-done:hover{color:var(--late)}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}

  /* ---------- print : all four on one page ---------- */
  @media print{
    @page{size:letter;margin:12mm}
    :root,:root[data-theme="dark"]{
      --bg:#fff; --ink:#000; --muted:#555; --line:#bbb; --line-soft:#ccc;
      --late:#b3403c; --late-ink:#fff;
    }
    body{background:#fff !important;color:#000;padding:0;font-size:11.5px}
    .controls,.add-row,.icon-btn,.handle,.sort-hint,.ro-note,.clear-done,.cal,
    .arch{display:none !important}
    .tasks{max-height:none !important;overflow:visible !important;
      -webkit-mask-image:none !important;mask-image:none !important;padding-right:0 !important}
    .masthead{border-color:#000;padding-bottom:8px;margin-bottom:6px}
    .masthead h1{color:#000;font-size:1.5rem}
    .dateline{color:#333}
    .grid{display:grid !important;grid-template-columns:1fr 1fr !important;gap:5mm}
    .q{background:#fff;border:1px solid #888;border-radius:4px;min-height:0;
      break-inside:avoid;padding:10px 12px 8px}
    .q-name{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:1.05rem}
    .q-head{border-color:#bbb}
    .q-count{color:#555}
    .task{border-color:#bbb;padding:5px 0 4px}
    .chk{border-color:#444;width:13px;height:13px}
    .chk.on{background:#000;border-color:#000}
    .chk.sm{width:10px;height:10px}
    .t-title{color:#000}
    .chip{border-color:#444 !important;color:#000 !important;background:#fff !important;font-size:.6rem}
    .chip.late{border:1.5px solid #b3403c !important;color:#b3403c !important;font-weight:700;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    .subs{margin-left:20px}
    .sub{color:#000;font-size:.78rem;padding:2px 0}
    .task.done-item .t-title,.sub.done-item .s-title{color:#666}
    details.done{border-color:#ccc}
    details.done summary{color:#555}
    .empty-hint{display:block;color:#888;padding:6px 2px}
    .print-lines{display:block}
  }
  .print-lines{display:none}
  .print-lines i{display:block;border-bottom:1px dotted #999;height:18px}
</style>
</head>
<body>


<div class="wrap">
  <header class="masthead">
    <div>
      <h1>The Four Corners</h1>
      <p class="dateline" id="dateline"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Sort mode">
        <button id="sortDeadline" aria-pressed="true">By deadline</button>
        <button id="sortManual" aria-pressed="false">Manual</button>
      </div>
      <button class="btn" id="themeBtn" aria-label="Switch between day and night mode">☾ Night</button>
      <button class="btn" id="archBtn" aria-expanded="false">Archive</button>
      <button class="btn" id="printBtn">Print</button>
      <span id="saveState" aria-live="polite"></span>
    </div>
  </header>
  <p class="ro-note">You're viewing a read-only copy — changes here won't be saved.</p>
  <p class="sort-hint" id="sortHint"></p>
  <main class="grid" id="grid"></main>
  <section class="arch" id="arch" aria-label="Archive"></section>
</div>

<script type="application/json" id="state">{"v":1,"savedAt":0,"sortMode":"deadline","tasks":[]}</script>
<script>
(function(){
  "use strict";
  var QUADS=[{k:"family",name:"Family"},{k:"personal",name:"Personal"},
             {k:"work",name:"Work"},{k:"dj",name:"DJ / Businesses"}];

  /* ---------- state ---------- */
  var state;
  try{ state=JSON.parse(document.getElementById("state").textContent); }
  catch(e){ state={v:1,savedAt:0,sortMode:"deadline",tasks:[]}; }
  try{
    var ls=localStorage.getItem("four-corners-state");
    if(ls){ var p=JSON.parse(ls); if(p && p.savedAt>state.savedAt) state=p; }
  }catch(e){}
  if(!Array.isArray(state.tasks)) state.tasks=[];
  if(!state.names||typeof state.names!=="object") state.names={};
  if(state.sortMode!=="manual") state.sortMode="deadline";

  var readOnly=false, saveTimer=null;

  function uid(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():("t"+Date.now()+Math.random().toString(36).slice(2,8)); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function todayStr(){
    var d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MFULL=["January","February","March","April","May","June","July","August",
             "September","October","November","December"];
  var MAX_OPEN=5;                       /* open tasks shown per corner before scrolling */
  var grid=document.getElementById("grid");
  var pendingDate={}, pendingTitle={};  /* survives re-renders of the add row */
  function chipLabel(due){
    if(!due) return "no date";
    var m=due.split("-");
    return MONTHS[(+m[1])-1]+" "+(+m[2]);
  }
  function chipClass(due,done){
    if(done||!due) return due?"":"none";
    return due<todayStr() ? "late" : "";
  }
  function qName(k){
    var n=state.names[k];
    if(n) return n;
    for(var i=0;i<QUADS.length;i++) if(QUADS[i].k===k) return QUADS[i].name;
    return k;
  }
  function findTask(id){ for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id===id) return state.tasks[i]; return null; }

  /* ---------- render ---------- */
  function render(){
    document.body.classList.toggle("manual",state.sortMode==="manual");
    document.body.classList.toggle("ro",readOnly);
    document.getElementById("sortDeadline").classList.toggle("on",state.sortMode!=="manual");
    document.getElementById("sortDeadline").setAttribute("aria-pressed",state.sortMode!=="manual");
    document.getElementById("sortManual").classList.toggle("on",state.sortMode==="manual");
    document.getElementById("sortManual").setAttribute("aria-pressed",state.sortMode==="manual");
    document.getElementById("sortHint").textContent = state.sortMode==="manual"
      ? "Manual order — drag the ⠿ handle to arrange tasks, even across quadrants."
      : "Sorted by deadline — the soonest due rises to the top of each quadrant.";

    var ed=(!readOnly)?' contenteditable="true" spellcheck="false"':"";
    var html="";
    QUADS.forEach(function(q){
      var open=state.tasks.filter(function(t){return t.q===q.k && !t.done && !t.deleted;});
      if(state.sortMode!=="manual")
        open=open.slice().sort(function(a,b){
          var da=a.due||"9999", db=b.due||"9999";
          return da<db?-1:da>db?1:(a.created||0)-(b.created||0);
        });

      html+='<section class="q" data-q="'+q.k+'"><div class="q-head">'
          +'<h2 class="q-name" data-act="qname" data-qk="'+q.k+'"'+ed
          +(readOnly?"":' title="Click to rename"')+'>'+esc(qName(q.k))+'</h2>'
          +'<span class="q-count">'+open.length+' open'
          +(open.length>MAX_OPEN?' · scroll for '+(open.length-MAX_OPEN)+' more':'')+'</span></div>';
      if(open.length===0){
        html+='<p class="empty-hint">Nothing yet — add one below.</p>'
            +'<div class="print-lines"><i></i><i></i><i></i></div>';
      }
      html+='<ul class="tasks" data-q="'+q.k+'">';
      open.forEach(function(t){ html+=taskHtml(t,ed,false); });
      html+='</ul>';
      var pd=pendingDate[q.k]||"", pt=pendingTitle[q.k]||"";
      html+='<form class="add-row" data-q="'+q.k+'" autocomplete="off">'
          +'<input class="add-title" placeholder="Add a task…" value="'+esc(pt)
          +'" aria-label="New task in '+esc(qName(q.k))+'">'
          +'<button type="button" class="add-date'+(pd?" set":"")+'" data-adddate="'+q.k
          +'" aria-label="Choose deadline">'+(pd?chipLabel(pd):"Set date")+'</button>'
          +'<button class="add-btn" type="submit" aria-label="Add task">+</button></form>';
      html+='</section>';
    });
    document.getElementById("grid").innerHTML=html;
    capLists();
    renderArchive();
  }

  /* ---------- archive: deleted tasks are kept, not destroyed ---------- */
  var archFilter="all";                      /* all | done | deleted */
  function isArchived(t){ return !!(t.done||t.deleted); }
  function archStamp(t){ return t.deleted?(t.deletedAt||0):(t.doneAt||0); }
  function archived(){
    return state.tasks.filter(function(t){
      if(!isArchived(t)) return false;
      if(archFilter==="done") return !t.deleted;
      if(archFilter==="deleted") return !!t.deleted;
      return true;
    }).slice().sort(function(a,b){ return archStamp(b)-archStamp(a); });
  }
  function whenLabel(ts){
    if(!ts) return "";
    var d=new Date(ts), t=new Date();
    var sameDay=d.toDateString()===t.toDateString();
    if(sameDay) return "today";
    var y=new Date(t.getTime()-864e5);
    if(d.toDateString()===y.toDateString()) return "yesterday";
    return MONTHS[d.getMonth()]+" "+d.getDate();
  }
  function renderArchive(){
    var list=archived(), box=document.getElementById("arch");
    var total=state.tasks.filter(isArchived).length;
    var nDone=state.tasks.filter(function(t){return t.done&&!t.deleted;}).length;
    var nDel=state.tasks.filter(function(t){return t.deleted;}).length;
    document.getElementById("archBtn").innerHTML=
      "Archive"+(total?' <span class="n">\u00b7 '+total+'</span>':"");
    var h='<div class="arch-head"><h2>Archive</h2>'
      +'<div class="arch-filter" role="group" aria-label="Filter archive">'
      +'<button type="button" data-filter="all"'+(archFilter==="all"?' class="on"':'')
      +'>All \u00b7 '+total+'</button>'
      +'<button type="button" data-filter="done"'+(archFilter==="done"?' class="on"':'')
      +'>Completed \u00b7 '+nDone+'</button>'
      +'<button type="button" data-filter="deleted"'+(archFilter==="deleted"?' class="on"':'')
      +'>Deleted \u00b7 '+nDel+'</button></div></div>';
    if(!list.length){
      h+='<p class="arch-note">'
        +(total?'Nothing here under this filter.'
               :'Nothing archived yet. Tasks you finish or delete are kept here, '
                +'and you can put any of them back.')+'</p>';
    }else{
      h+='<ul class="arch-list">';
      list.forEach(function(t){
        var subs=(t.subs||[]).length;
        h+='<li class="arch-item'+(t.deleted?"":" was-done")+'" data-id="'+t.id+'">'
          +'<span class="arch-corner">'+esc(qName(t.q))+'</span>'
          +'<span class="arch-mark" aria-hidden="true">'+(t.deleted?"\u00d7":"\u2713")+'</span>'
          +'<span class="arch-title">'+esc(t.title)+'</span>'
          +'<span class="arch-when">'+(t.due?chipLabel(t.due)+" \u00b7 ":"")
          +(t.deleted?"deleted ":"done ")+whenLabel(archStamp(t))+'</span>'
          +(readOnly?"":'<button type="button" class="arch-act" data-arch="restore">Restore</button>'
            +'<button type="button" class="arch-act danger" data-arch="purge">Delete forever</button>')
          +(subs?'<span class="arch-subs">'+subs+' sub-task'+(subs>1?"s":"")
            +' kept with it</span>':"")
          +'</li>';
      });
      h+='</ul>';
      if(!readOnly)
        h+='<div class="arch-foot"><button type="button" class="arch-act danger" '
          +'data-arch="purgeall">'
          +(archFilter==="all"?"Empty archive"
            :archFilter==="done"?"Delete all completed":"Delete all deleted")
          +'</button></div>';
    }
    box.innerHTML=h;
  }

  /* two-step confirm so nothing is destroyed on a single click */
  var confirmTimer=null;
  function armConfirm(btn,run){
    if(btn.classList.contains("confirming")){
      clearTimeout(confirmTimer); run(); return;
    }
    document.querySelectorAll(".arch-act.confirming").forEach(function(o){
      o.classList.remove("confirming"); o.textContent=o.dataset.label||o.textContent;
    });
    btn.dataset.label=btn.textContent;
    btn.classList.add("confirming"); btn.textContent="Sure?";
    clearTimeout(confirmTimer);
    confirmTimer=setTimeout(function(){
      if(btn.isConnected){ btn.classList.remove("confirming"); btn.textContent=btn.dataset.label; }
    },4000);
  }

  document.getElementById("arch").addEventListener("click",function(ev){
    var f0=ev.target.closest("[data-filter]");
    if(f0){ archFilter=f0.dataset.filter; renderArchive(); return; }
    var b=ev.target.closest("[data-arch]"); if(!b||readOnly) return;
    var act=b.dataset.arch;
    if(act==="purgeall"){
      armConfirm(b,function(){
        var keep=archFilter==="all"?function(t){return !isArchived(t);}
              :archFilter==="done"?function(t){return !(t.done&&!t.deleted);}
              :function(t){return !t.deleted;};
        state.tasks=state.tasks.filter(keep);
        render(); scheduleSave();
      });
      return;
    }
    var f=ev.target.closest("[data-filter]");
    if(f){ archFilter=f.dataset.filter; renderArchive(); return; }
    var li=b.closest(".arch-item"); if(!li) return;
    var id=li.dataset.id, t=findTask(id); if(!t) return;
    if(act==="restore"){
      delete t.deleted; delete t.deletedAt;
      t.done=false; t.doneAt=null;            /* back to its corner, unchecked */
      render(); scheduleSave();
    }else if(act==="purge"){
      armConfirm(b,function(){
        state.tasks=state.tasks.filter(function(x){return x.id!==id;});
        render(); scheduleSave();
      });
    }
  });

  document.getElementById("archBtn").addEventListener("click",function(){
    var open=document.body.classList.toggle("arch-open");
    this.setAttribute("aria-expanded",open?"true":"false");
    if(open) document.getElementById("arch").scrollIntoView({block:"nearest",
      behavior:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth"});
  });

  /* ---------- show at most MAX_OPEN tasks, scroll the rest ---------- */
  function capLists(){
    grid.querySelectorAll(".tasks").forEach(function(list){
      list.style.maxHeight=""; list.classList.remove("capped","at-end");
      var items=list.children;
      if(items.length<=MAX_OPEN || !list.offsetHeight) return;
      var h=items[MAX_OPEN].offsetTop-items[0].offsetTop;
      if(h>0){ list.style.maxHeight=h+"px"; list.classList.add("capped"); markEnd(list); }
    });
  }
  function markEnd(list){
    var atEnd=list.scrollTop+list.clientHeight>=list.scrollHeight-2;
    list.classList.toggle("at-end",atEnd);
  }
  grid.addEventListener("scroll",function(ev){
    if(ev.target.classList&&ev.target.classList.contains("capped")) markEnd(ev.target);
  },true);
  grid.addEventListener("toggle",capLists,true);   /* Done section opened/closed */
  window.addEventListener("resize",capLists);

  function taskHtml(t,ed,isDone){
    var h='<li class="task'+(isDone?" done-item":"")+'" data-id="'+t.id+'">'
        +'<div class="task-row">'
        +(isDone?"":'<span class="handle" aria-hidden="true">⠿</span>')
        +'<button type="button" class="chk'+(t.done?" on":"")+'" data-act="toggle" aria-label="'+(t.done?"Mark not done":"Mark done")+'"></button>'
        +'<span class="t-title" data-act="title"'+(isDone?"":ed)+'>'+esc(t.title)+'</span>'
        +'<button type="button" class="chip '+chipClass(t.due,t.done)+'" data-act="date" title="Change deadline">'+chipLabel(t.due)+'</button>';
    if(!isDone && !readOnly)
      h+='<button type="button" class="icon-btn" data-act="addsub" title="Add sub-task">+</button>';
    if(!readOnly)
      h+='<button type="button" class="icon-btn" data-act="del" title="Delete task">×</button>';
    h+='</div>';
    if(t.subs && t.subs.length){
      h+='<ul class="subs">';
      t.subs.forEach(function(s){
        h+='<li class="sub'+(s.d?" done-item":"")+'" data-sid="'+s.id+'">'
          +'<button type="button" class="chk sm'+(s.d?" on":"")+'" data-act="subtoggle" aria-label="Toggle sub-task"></button>'
          +'<span class="s-title" data-act="subtitle"'+(isDone?"":ed)+'>'+esc(s.t)+'</span>'
          +(readOnly?"":'<button type="button" class="icon-btn" data-act="subdel" title="Delete sub-task">×</button>')
          +'</li>';
      });
      h+='</ul>';
    }
    return h+'</li>';
  }

  /* ---------- saving ---------- */
  function setStatus(s){
    var el=document.getElementById("saveState");
    el.textContent = s==="saving"?"Saving…"
      : (s==="local"||s==="saved")?"Saved on this device"
      : s==="ro"?"Read-only" : "";
  }
  function scheduleSave(){
    if(readOnly) return;
    setStatus("saving");
    clearTimeout(saveTimer);
    saveTimer=setTimeout(doSave,2200);
  }
  function serialize(){
    state.savedAt=Date.now();
    return JSON.stringify(state).replace(/</g,"\\u003c");
  }
  function isEditing(){
    var a=document.activeElement;
    return !!(a && grid.contains(a) &&
      (a.isContentEditable || (a.tagName==="INPUT" && a.value!=="")));
  }
  function doSave(){
    if(isEditing()){ saveTimer=setTimeout(doSave,1600); return; }
    saveLocal(serialize());
  }
  function saveLocal(json){
    try{ localStorage.setItem("four-corners-state",json); setStatus("local"); }
    catch(e){ setStatus(""); }
  }

  /* ---------- interactions ---------- */

  grid.addEventListener("submit",function(ev){
    var f=ev.target.closest(".add-row"); if(!f) return;
    ev.preventDefault();
    if(readOnly) return;
    var q=f.dataset.q, title=f.querySelector(".add-title");
    var text=title.value.trim(), dateBtn=f.querySelector(".add-date");
    if(!text){ title.focus(); return; }
    if(!pendingDate[q]){                   /* every task needs a deadline */
      dateBtn.classList.add("need");
      openCal(dateBtn,todayStr(),function(v){ setPending(q,v); });
      return;
    }
    state.tasks.push({id:uid(),q:q,title:text,due:pendingDate[q],
                      done:false,doneAt:null,created:Date.now(),subs:[]});
    pendingTitle[q]="";                    /* keep the date for the next task */
    render(); scheduleSave();
    var nf=grid.querySelector('.add-row[data-q="'+q+'"]');
    if(nf) nf.querySelector(".add-title").focus();
  });
  grid.addEventListener("input",function(ev){
    if(ev.target.classList.contains("add-title")){
      var f=ev.target.closest(".add-row");
      if(f) pendingTitle[f.dataset.q]=ev.target.value;
    }
  });
  function setPending(q,v){
    pendingDate[q]=v;
    var b=grid.querySelector('.add-date[data-adddate="'+q+'"]');
    if(b){ b.textContent=chipLabel(v); b.classList.add("set"); b.classList.remove("need"); }
  }

  grid.addEventListener("click",function(ev){
    var b=ev.target.closest("[data-act]"); if(!b) return;
    var act=b.dataset.act;
    var li=b.closest(".task"); if(!li) return;
    var t=findTask(li.dataset.id); if(!t) return;
    if(readOnly && act!=="none") { if(act==="toggle"||act==="del"||act==="addsub"||act==="subtoggle"||act==="subdel"||act==="date") return; }

    if(act==="toggle"){
      t.done=!t.done; t.doneAt=t.done?Date.now():null;   /* completing files it in the archive */
      render(); scheduleSave();
    }
    else if(act==="del"){
      t.deleted=true; t.deletedAt=Date.now();   /* goes to the archive, not away */
      render(); scheduleSave();
    }
    else if(act==="addsub"){
      t.subs=t.subs||[];
      t.subs.push({id:uid(),t:"",d:false});
      render();                       /* saved when the text is committed */
      var el=grid.querySelector('.task[data-id="'+t.id+'"] .sub:last-child .s-title');
      if(el) el.focus();
    }
    else if(act==="subtoggle"||act==="subdel"){
      var sli=b.closest(".sub"); if(!sli) return;
      var sid=sli.dataset.sid;
      if(act==="subtoggle"){
        t.subs.forEach(function(s){ if(s.id===sid) s.d=!s.d; });
      }else{
        t.subs=t.subs.filter(function(s){return s.id!==sid;});
      }
      render(); scheduleSave();
    }
    else if(act==="date"){
      if(readOnly) return;
      if(calOpenFor(b)){ closeCal(); return; }
      openCal(b,t.due,function(v){ t.due=v; render(); scheduleSave(); });
    }
  });

  /* inline title editing */
  grid.addEventListener("keydown",function(ev){
    var el=ev.target;
    if(el.dataset&&(el.dataset.act==="title"||el.dataset.act==="subtitle"||el.dataset.act==="qname")){
      if(ev.key==="Enter"){ ev.preventDefault(); el.blur(); }
      else if(ev.key==="Escape"){ ev.preventDefault(); el.dataset.cancel="1"; el.blur(); }
    }
  });
  grid.addEventListener("focusout",function(ev){
    var el=ev.target;
    if(el.dataset&&el.dataset.act==="qname"){
      var k=el.dataset.qk;
      var wasCancelled=el.dataset.cancel==="1"; delete el.dataset.cancel;
      var name=el.textContent.replace(/\s+/g," ").trim();
      if(!wasCancelled && name!==qName(k)){
        if(name) state.names[k]=name; else delete state.names[k];  /* blank restores default */
        scheduleSave();
      }
      render(); return;
    }
    if(!el.dataset||(el.dataset.act!=="title"&&el.dataset.act!=="subtitle")) return;
    var li=el.closest(".task"); if(!li) return;
    var t=findTask(li.dataset.id); if(!t) return;
    var cancelled=el.dataset.cancel==="1"; delete el.dataset.cancel;
    var val=el.textContent.replace(/\s+/g," ").trim();
    if(el.dataset.act==="title"){
      if(!cancelled && val && val!==t.title){ t.title=val; scheduleSave(); }
      render();
    }else{
      var sli=el.closest(".sub"); if(!sli) return;
      var sid=sli.dataset.sid, sub=null;
      (t.subs||[]).forEach(function(s){ if(s.id===sid) sub=s; });
      if(!sub){ render(); return; }
      if(cancelled){
        if(!sub.t){ t.subs=t.subs.filter(function(s){return s.id!==sid;}); scheduleSave(); }
        render(); return;
      }
      if(!val){ t.subs=t.subs.filter(function(s){return s.id!==sid;}); scheduleSave(); render(); return; }
      if(val!==sub.t){ sub.t=val; scheduleSave(); }
      render();
    }
  });

  /* ---------- drag & drop (manual mode) ---------- */
  var dragId=null;
  /* arm dragging only from the handle, so text editing never starts a drag */
  grid.addEventListener("pointerdown",function(ev){
    var h=ev.target.closest(".handle");
    if(h && !readOnly && state.sortMode==="manual"){
      var li=h.closest(".task");
      if(li) li.setAttribute("draggable","true");
    }
  });
  grid.addEventListener("pointerup",function(){
    grid.querySelectorAll('.task[draggable]').forEach(function(el){
      if(!el.classList.contains("dragging")) el.removeAttribute("draggable");
    });
  });
  grid.addEventListener("dragstart",function(ev){
    var li=ev.target.closest(".task"); if(!li||state.sortMode!=="manual") return;
    dragId=li.dataset.id; li.classList.add("dragging");
    ev.dataTransfer.effectAllowed="move";
    try{ ev.dataTransfer.setData("text/plain",dragId); }catch(e){}
  });
  grid.addEventListener("dragend",function(){
    dragId=null;
    grid.querySelectorAll(".dragging,.drop-above,.drop-below").forEach(function(el){
      el.classList.remove("dragging","drop-above","drop-below");
    });
  });
  grid.addEventListener("dragover",function(ev){
    if(!dragId) return;
    var list=ev.target.closest(".tasks[data-q]"); if(!list) return;
    ev.preventDefault(); ev.dataTransfer.dropEffect="move";
    grid.querySelectorAll(".drop-above,.drop-below").forEach(function(el){
      el.classList.remove("drop-above","drop-below");
    });
    var over=ev.target.closest(".task");
    if(over&&over.dataset.id!==dragId){
      var r=over.getBoundingClientRect();
      over.classList.add(ev.clientY < r.top+r.height/2 ? "drop-above" : "drop-below");
    }
  });
  grid.addEventListener("drop",function(ev){
    if(!dragId) return;
    var list=ev.target.closest(".tasks[data-q]"); if(!list) return;
    ev.preventDefault();
    var t=findTask(dragId); if(!t) return;
    var targetQ=list.dataset.q;
    var over=ev.target.closest(".task");
    var before=null;
    if(over&&over.dataset.id!==dragId){
      var r=over.getBoundingClientRect();
      before = ev.clientY < r.top+r.height/2 ? over.dataset.id : nextOpenId(over);
    }
    state.tasks=state.tasks.filter(function(x){return x.id!==dragId;});
    t.q=targetQ;
    var idx = before ? state.tasks.findIndex(function(x){return x.id===before;}) : -1;
    if(idx<0){
      /* append after the last open task of that quadrant (or end) */
      var last=-1;
      state.tasks.forEach(function(x,i){ if(x.q===targetQ&&!x.done) last=i; });
      idx=last+1; if(last<0) idx=state.tasks.length;
    }
    state.tasks.splice(idx,0,t);
    dragId=null;
    render(); scheduleSave();
  });
  function nextOpenId(li){
    var n=li.nextElementSibling;
    while(n&&!n.classList.contains("task")) n=n.nextElementSibling;
    return n?n.dataset.id:null;
  }

  /* ---------- calendar popover ---------- */
  var cal=document.createElement("div");
  cal.className="cal"; cal.setAttribute("role","dialog");
  cal.setAttribute("aria-label","Choose a deadline");
  document.body.appendChild(cal);
  var calY=0,calM=0,calSel=null,calAnchor=null,calPick=null;

  function fmt(dt){
    return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")
      +"-"+String(dt.getDate()).padStart(2,"0");
  }
  function calOpenFor(el){ return cal.classList.contains("open") && calAnchor===el; }

  function drawCal(){
    var t=todayStr();
    var start=new Date(calY,calM,1).getDay();
    var dim=new Date(calY,calM+1,0).getDate();
    var total=Math.ceil((start+dim)/7)*7;
    var h='<div class="cal-head">'
      +'<button type="button" class="cal-nav" data-cal="py" aria-label="Previous year">\u00ab</button>'
      +'<button type="button" class="cal-nav" data-cal="pm" aria-label="Previous month">\u2039</button>'
      +'<span class="cal-title">'+MFULL[calM]+' '+calY+'</span>'
      +'<button type="button" class="cal-nav" data-cal="nm" aria-label="Next month">\u203a</button>'
      +'<button type="button" class="cal-nav" data-cal="ny" aria-label="Next year">\u00bb</button>'
      +'</div><div class="cal-grid">';
    ["S","M","T","W","T","F","S"].forEach(function(d){ h+='<span class="cal-dow">'+d+'</span>'; });
    for(var c=0;c<total;c++){
      var dt=new Date(calY,calM,c-start+1), v=fmt(dt);
      var cls="cal-day"+(dt.getMonth()===calM?"":" other")
        +(v<t?" past":"")+(v===t?" today":"")+(v===calSel?" sel":"");
      h+='<button type="button" class="'+cls+'" data-pick="'+v+'"'
        +(v===calSel?' aria-current="date"':'')+'>'+dt.getDate()+'</button>';
    }
    h+='</div><div class="cal-foot">'
      +'<button type="button" data-cal="today">Today</button>'
      +'<button type="button" data-cal="close">Close</button></div>';
    cal.innerHTML=h;
  }

  function placeCal(){
    if(!calAnchor) return;
    var r=calAnchor.getBoundingClientRect();
    var w=cal.offsetWidth, hh=cal.offsetHeight, pad=8;
    var top=r.bottom+6;
    if(top+hh>window.innerHeight-pad) top=r.top-hh-6;          /* flip above */
    if(top<pad) top=Math.max(pad,window.innerHeight-hh-pad);   /* last resort */
    var left=r.left;
    if(left+w>window.innerWidth-pad) left=window.innerWidth-w-pad;
    if(left<pad) left=pad;
    cal.style.top=top+"px"; cal.style.left=left+"px";
  }

  function openCal(anchor,value,onPick){
    var p=(value||todayStr()).split("-");
    calY=+p[0]; calM=(+p[1])-1; calSel=value||null;
    calAnchor=anchor; calPick=onPick;
    drawCal();
    cal.style.visibility="hidden"; cal.classList.add("open");
    placeCal(); cal.style.visibility="";
    document.addEventListener("keydown",calKey,true);
  }
  function closeCal(){
    cal.classList.remove("open"); calAnchor=null; calPick=null;
    document.removeEventListener("keydown",calKey,true);
  }
  function calKey(ev){
    if(ev.key==="Escape"){ ev.preventDefault(); var a=calAnchor; closeCal(); if(a) a.focus(); }
  }

  cal.addEventListener("click",function(ev){
    var nav=ev.target.closest("[data-cal]");
    if(nav){
      var k=nav.dataset.cal;
      if(k==="close"){ var a=calAnchor; closeCal(); if(a) a.focus(); return; }
      if(k==="pm"){ if(--calM<0){ calM=11; calY--; } }
      else if(k==="nm"){ if(++calM>11){ calM=0; calY++; } }
      else if(k==="py") calY--;
      else if(k==="ny") calY++;
      else if(k==="today"){ var p=todayStr().split("-"); calY=+p[0]; calM=(+p[1])-1; }
      drawCal(); placeCal(); return;
    }
    var day=ev.target.closest("[data-pick]");
    if(day){ var v=day.dataset.pick, cb=calPick; closeCal(); if(cb) cb(v); }
  });
  document.addEventListener("pointerdown",function(ev){
    if(!cal.classList.contains("open")) return;
    if(cal.contains(ev.target)) return;
    if(calAnchor&&calAnchor.contains(ev.target)) return;
    closeCal();
  },true);
  window.addEventListener("resize",placeCal);
  window.addEventListener("scroll",placeCal,true);

  /* deadline button on the add row */
  grid.addEventListener("click",function(ev){
    var b=ev.target.closest("[data-adddate]"); if(!b||readOnly) return;
    var q=b.dataset.adddate;
    if(calOpenFor(b)){ closeCal(); return; }
    openCal(b,pendingDate[q]||todayStr(),function(v){ setPending(q,v); });
  });

  /* ---------- top controls ---------- */
  document.getElementById("sortDeadline").addEventListener("click",function(){
    if(state.sortMode!=="deadline"){ state.sortMode="deadline"; render(); scheduleSave(); }
  });
  document.getElementById("sortManual").addEventListener("click",function(){
    if(state.sortMode!=="manual"){
      /* freeze current deadline order as the starting manual order */
      var ordered=[];
      QUADS.forEach(function(q){
        state.tasks.filter(function(t){return t.q===q.k&&!t.done&&!t.deleted;})
          .sort(function(a,b){var da=a.due||"9999",db=b.due||"9999";
            return da<db?-1:da>db?1:(a.created||0)-(b.created||0);})
          .forEach(function(t){ordered.push(t);});
      });
      state.tasks.filter(function(t){return t.done&&!t.deleted;}).forEach(function(t){ordered.push(t);});
      state.tasks.filter(function(t){return t.deleted;}).forEach(function(t){ordered.push(t);});
      state.tasks=ordered;
      state.sortMode="manual"; render(); scheduleSave();
    }
  });
  document.getElementById("printBtn").addEventListener("click",function(){ window.print(); });

  /* ---------- day & night mode ---------- */
  var themeBtn=document.getElementById("themeBtn");
  function effTheme(){
    var t=document.documentElement.getAttribute("data-theme");
    if(t==="light"||t==="dark") return t;
    return (window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  }
  function paintThemeBtn(){
    themeBtn.textContent = effTheme()==="dark" ? "☀ Day" : "☾ Night";
  }
  themeBtn.addEventListener("click",function(){
    var next=effTheme()==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{ localStorage.setItem("fc-theme",next); }catch(e){}
    paintThemeBtn();
  });
  try{
    var savedTheme=localStorage.getItem("fc-theme");
    if(savedTheme==="light"||savedTheme==="dark")
      document.documentElement.setAttribute("data-theme",savedTheme);
  }catch(e){}
  if(window.matchMedia){
    try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintThemeBtn); }catch(e){}
  }
  paintThemeBtn();

  /* ---------- boot ---------- */
  var now=new Date();
  var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  document.getElementById("dateline").textContent =
    DAYS[now.getDay()]+" · "+MFULL[now.getMonth()]+" "+now.getDate()+", "+now.getFullYear();

  render();
  try{
    var sc=sessionStorage.getItem("fc-scroll");
    if(sc){ sessionStorage.removeItem("fc-scroll"); window.scrollTo(0,+sc); }
  }catch(e){}
})();
</script>

</body>
</html>
